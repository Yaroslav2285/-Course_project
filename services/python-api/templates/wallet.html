<!-- LR #7: Frontend/UI -->
{% extends "base.html" %}
{% block title %}Wallet — Service Marketplace{% endblock %}
{% block content %}
<div class="dashboard-header">
  <h1>Wallet</h1>
</div>

{% include "wallet-card.html" %}

<!-- Wallet History -->
<div class="card">
  <div class="wallet-history-header">
    <h3>Transaction History</h3>
  </div>
  <div class="wallet-history-table-wrap">
    <table class="wallet-history-table" role="table" aria-label="Wallet Transaction History">
      <thead>
        <tr>
          <th scope="col">Date</th>
          <th scope="col">Type</th>
          <th scope="col">Amount</th>
          <th scope="col">Status</th>
          <th scope="col">ID</th>
        </tr>
      </thead>
      <tbody id="wallet-history-body">
        <tr><td colspan="5"><div class="flex-center" style="padding:24px;"><div class="spinner"></div></div></td></tr>
      </tbody>
    </table>
  </div>
  <div id="wallet-history-empty" class="wallet-history-empty" style="display:none;">
    No transactions
  </div>
  <div class="wallet-history-footer">
    <button id="wallet-history-more" class="btn btn-outline btn-sm" style="display:none;">Show more</button>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/api/static/js/wallet.js?v=4"></script>
<script>if (typeof initWallet === 'function') initWallet();</script>
{% endblock %}
