<!-- LR #6: Web/DB — Executor dashboard with services CRUD + incoming orders -->
{% extends "base.html" %}
{% block title %}Executor Dashboard — Service Marketplace{% endblock %}
{% block content %}
<h1 class="mb-4">Executor Dashboard</h1>
<div id="alert-container"></div>

<div class="card mb-4">
  <div class="card-header flex-between">
    <span>My Services <span id="services-count" class="text-secondary"></span></span>
    <button class="btn btn-primary btn-sm" onclick="openCreateServiceModal()">+ New Service</button>
  </div>
  <div id="services-content">
    <div class="flex-center" style="padding:40px;"><div class="spinner"></div></div>
  </div>
</div>

<div class="card mb-4">
  <div class="card-header flex-between">
    <span>Incoming Orders <span id="incoming-count" class="text-secondary"></span></span>
  </div>
  <div id="incoming-content">
    <div class="flex-center" style="padding:40px;"><div class="spinner"></div></div>
  </div>
</div>

<!-- Service Create/Edit Modal -->
<div id="service-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeServiceModal()">
  <div class="modal">
    <h3 id="modal-title">Create Service</h3>
    <input type="hidden" id="svc-id">
    <div class="form-group">
      <label for="svc-title">Title</label>
      <input type="text" id="svc-title" class="form-control" placeholder="Service title" required maxlength="200">
    </div>
    <div class="form-group">
      <label for="svc-desc">Description</label>
      <textarea id="svc-desc" class="form-control" placeholder="Describe your service..." rows="3"></textarea>
    </div>
    <div class="form-group">
      <label for="svc-price">Price ($)</label>
      <input type="number" id="svc-price" class="form-control" placeholder="0.00" min="0.01" step="0.01" required>
    </div>
    <div class="form-group">
      <label for="svc-status">Status</label>
      <select id="svc-status" class="form-control">
        <option value="draft">Draft</option>
        <option value="published">Published</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeServiceModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveService()">Save</button>
    </div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script src="/api/static/js/dashboard.js"></script>
{% endblock %}
