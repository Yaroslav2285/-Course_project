{% extends "base.html" %}
{% block title %}Order Detail — Service Marketplace{% endblock %}
{% block content %}
<div id="order-detail-loading" class="card" style="padding:40px;">
  <div class="flex-center"><div class="spinner"></div></div>
</div>
<div id="order-detail-error" class="hidden" style="padding:24px;">
  <div class="alert alert-error" id="order-detail-error-message">Failed to load order.</div>
  <button type="button" class="btn btn-primary" onclick="loadOrderDetail()">Retry</button>
  <a href="/dashboard" class="btn btn-outline">Back to Dashboard</a>
</div>
<div id="order-detail-content" class="hidden">
  <div class="dashboard-header" style="justify-content:space-between;align-items:center;">
    <h1>Order Detail</h1>
    <a href="/dashboard" class="btn btn-outline btn-sm">&larr; Back to Dashboard</a>
  </div>
  <div id="alert-container"></div>
  <!-- Order Info Grid -->
  <div class="card">
    <div class="escrow-info-grid" id="order-info-grid"></div>
  </div>
  <!-- Escrow Panel -->
  <div id="escrow-panel-container"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="/api/static/js/escrow-panel.js?v=18"></script>
<script>initOrderDetailPage();</script>
{% endblock %}
