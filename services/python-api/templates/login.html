{% extends "base.html" %}
{% block title %}Sign In — Service Marketplace{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2>Sign In</h2>
    <div id="alert-container"></div>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="user@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="At least 8 characters" minlength="8" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-full">Sign In</button>
    </form>
    <div class="auth-switch">
      <span>Don't have an account?</span>
      <a href="/register">Register</a>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  var form = document.getElementById('login-form');
  if (form) {
    form.addEventListener('submit', handleLogin);
  }
});
</script>
{% endblock %}
