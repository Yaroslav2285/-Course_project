<!-- LR #6: Web/DB — Client dashboard with orders list -->
{% extends "base.html" %}
{% block title %}Client Dashboard — Service Marketplace{% endblock %}
{% block content %}
<h1 class="mb-4">Client Dashboard</h1>
<div id="alert-container"></div>

<div class="card mb-4">
  <div class="card-header flex-between">
    <span>My Orders <span id="orders-count" class="text-secondary"></span></span>
  </div>
  <div id="orders-content">
    <div class="flex-center" style="padding:40px;"><div class="spinner"></div></div>
  </div>
</div>

<div class="flex gap-2">
  <a href="/catalog" class="btn btn-primary">Browse Services</a>
</div>
{% endblock %}
{% block scripts %}
<script src="/api/static/js/dashboard.js"></script>
{% endblock %}
