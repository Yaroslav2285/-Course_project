<!DOCTYPE html>
<!-- LR #6: Web/DB — Base template for Service Marketplace UI -->
<!-- LR #12: AI Integration — Jinja2 base with navbar, toast, scripts -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Service Marketplace{% endblock %}</title>
  <link rel="stylesheet" href="/api/static/css/main.css?v=5">
  <link rel="stylesheet" href="/api/static/css/skeleton.css?v=1">
  <link rel="stylesheet" href="/api/static/css/catalog.css?v=5">
  <link rel="stylesheet" href="/api/static/css/dashboard.css?v=5">
  <link rel="stylesheet" href="/api/static/css/escrow.css?v=5">
  <link rel="stylesheet" href="/api/static/css/audit.css?v=5">
  <link rel="stylesheet" href="/api/static/css/responsive.css?v=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛒</text></svg>">
</head>
<body>
  <nav class="navbar" id="navbar">
    <a href="/" class="navbar-brand">Marketplace</a>
    <div class="navbar-menu" id="navbar-menu">
      <a href="/login">Login</a>
      <a href="/register">Register</a>
    </div>
    <div class="navbar-user hidden" id="navbar-user">
      <div>
        <div class="user-email" id="user-email"></div>
        <div class="user-role" id="user-role"></div>
      </div>
      <a href="#" class="btn btn-outline btn-sm" id="logout-btn">Logout</a>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Service Marketplace. All rights reserved.</p>
    </div>
  </footer>
  <div id="toast-container" class="toast-container" aria-live="polite" aria-relevant="additions"></div>

  <!-- Global error boundary -->
  <script>
    // LR #15: Security/UX — Global error handler with reentry guard
    var _handlingError = false;
    window.onerror = function (msg, url, line, col, err) {
      if (_handlingError) return true;
      _handlingError = true;
      console.error('[Global Error]', msg, 'at', url, 'line', line, err);
      try {
        if (typeof showToast === 'function') {
          showToast('An unexpected error occurred. Please try again.', 'error');
        }
      } catch (e) { /* ignore */ }
      _handlingError = false;
      return true;
    };
    window.addEventListener('unhandledrejection', function (e) {
      if (_handlingError) return;
      _handlingError = true;
      console.error('[Unhandled Rejection]', e.reason);
      try {
        if (typeof showToast === 'function') {
          showToast('An unexpected error occurred. Please try again.', 'error');
        }
      } catch (err) { /* ignore */ }
      _handlingError = false;
      e.preventDefault();
    });
  </script>

  <script src="/api/static/js/api.js?v=5"></script>
  <script src="/api/static/js/api-client.js?v=1"></script>
  <script src="/api/static/js/toast.js?v=1"></script>
  <script src="/api/static/js/utils.js?v=6"></script>
  <script src="/api/static/js/auth.js?v=5"></script>
  <script>
    // Run navbar update immediately after auth.js loads
    if (typeof updateNavbar === 'function') updateNavbar();
  </script>
  <script src="/api/static/js/app.js?v=5"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
