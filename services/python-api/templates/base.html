<!DOCTYPE html>
<!-- LR #6: Web/DB — Base template for Service Marketplace UI -->
<!-- LR #12: AI Integration — Jinja2 base with navbar, toast, scripts -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Service Marketplace{% endblock %}</title>
  <link rel="stylesheet" href="/api/static/css/main.css">
  <link rel="stylesheet" href="/api/static/css/catalog.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛒</text></svg>">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <div id="toast-container" class="toast-container"></div>

  <script src="/api/static/js/api.js"></script>
  <script src="/api/static/js/utils.js"></script>
  <script src="/api/static/js/auth.js"></script>
  <script src="/api/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
