<!-- LR #6: Web/DB — Dashboard redirect page -->
{% extends "base.html" %}
{% block title %}Dashboard — Service Marketplace{% endblock %}
{% block content %}
<div class="text-center" style="padding:60px 0;">
  <div class="spinner"></div>
  <p class="text-secondary mt-4">Redirecting to your dashboard...</p>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  var auth = checkAuth();
  if (!auth.isAuthenticated) {
    window.location.href = '/login';
  } else if (auth.role === 'provider') {
    window.location.href = '/dashboard/executor';
  } else {
    window.location.href = '/dashboard/client';
  }
});
</script>
{% endblock %}
