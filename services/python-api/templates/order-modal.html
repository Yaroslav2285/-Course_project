<!-- LR #6: Web/DB — Order creation modal (Phase 7.5) -->
<!-- LR #10: Multi-lang/REST — validation, loading spinner, error display -->
<!-- LR #15: Security/UX — role="dialog", aria-modal, focus trap, keyboard nav -->
<div id="order-modal"
     class="modal-overlay hidden"
     role="dialog"
     aria-modal="true"
     aria-label="Place Order"
     aria-describedby="order-modal-desc"
     onclick="if(event.target===this)closeOrderModal()"
     tabindex="-1">
  <div class="modal" style="max-width:520px;">
    <h3 id="order-modal-desc">Place Order</h3>
    <div id="order-modal-service" class="order-modal-service-info"></div>
    <div class="form-group">
      <label for="order-notes">Order Description</label>
      <textarea id="order-notes" class="form-control" placeholder="Describe what you need done..." rows="3" maxlength="2000" aria-required="false"></textarea>
    </div>
    <div class="form-group">
      <label for="order-deadline">Deadline (optional)</label>
      <input type="date" id="order-deadline" class="form-control" min="" aria-required="false">
    </div>
    <div class="form-group">
      <label for="order-files">Attachments (optional)</label>
      <input type="file" id="order-files" class="form-control" multiple accept=".pdf,.doc,.docx,.zip,.png,.jpg,.jpeg" aria-required="false">
      <span class="form-hint">Max 5 files. PDF, DOC, ZIP, images.</span>
    </div>
    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" id="order-offer-accept" aria-required="true">
        <span>I agree to the <a href="#" onclick="event.preventDefault();showToast('Offer terms: Escrow service protects both parties. Payment released only after mutual confirmation.','info')">Offer Terms</a></span>
      </label>
    </div>
    <div id="order-modal-error" class="alert alert-error hidden" role="alert"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeOrderModal()" aria-label="Cancel order">Cancel</button>
      <button class="btn btn-primary" id="order-modal-submit" onclick="submitOrderModal()" aria-label="Place order">
        <span id="order-modal-submit-text">Place Order</span>
        <span id="order-modal-submit-spinner" class="spinner hidden" style="width:16px;height:16px;margin:0;"></span>
      </button>
    </div>
  </div>
</div>
