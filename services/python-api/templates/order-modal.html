<!-- LR #6: Web/DB — Order creation modal (Phase 7.6) -->
<!-- LR #10: Multi-lang/REST — validation, loading spinner, error display -->
<!-- LR #15: Security/UX — role="dialog", aria-modal, focus trap, keyboard nav -->
<div id="order-modal"
     class="modal-overlay hidden"
     role="dialog"
     aria-modal="true"
     aria-label="Place Order"
     aria-describedby="order-modal-desc"
     onclick="if(event.target===this)closeOrderModal()"
     tabindex="-1">
  <div class="modal order-modal-content">
    <h3 id="order-modal-desc">Place Order</h3>
    <div id="order-modal-service" class="order-modal-service-info"></div>

    <div class="order-summary-card">
      <div id="order-modal-product" class="order-product-detail">
        <span class="order-product-label">Product</span>
        <span class="order-product-title" id="order-product-title"></span>
      </div>
      <div id="order-modal-description" class="order-product-detail" style="display:none;">
        <span class="order-product-label">Description</span>
        <span class="order-product-description" id="order-product-description"></span>
      </div>
    </div>

    <div class="order-quantity-row">
      <label for="order-qty" class="order-qty-label">Quantity</label>
      <div class="order-qty-controls">
        <button type="button" class="btn-qty" id="order-qty-dec" aria-label="Decrease quantity">−</button>
        <input type="number" id="order-qty" class="form-control order-qty-input" value="1" min="1" max="99" aria-label="Quantity">
        <button type="button" class="btn-qty" id="order-qty-inc" aria-label="Increase quantity">+</button>
      </div>
    </div>

    <div class="order-total-row">
      <span class="order-total-label">Total</span>
      <span class="order-total-price" id="order-total-price">$0.00</span>
    </div>

    <div class="order-product-detail" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--gray-200);">
      <span class="order-product-label">Unit Price</span>
      <span class="order-product-unit-price" id="order-unit-price"></span>
    </div>

    <p class="order-modal-confirm-text">Your order will be processed after payment confirmation.</p>
    <div id="order-modal-error" class="alert alert-error hidden" role="alert"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeOrderModal()" aria-label="Cancel order">Cancel</button>
      <button class="btn btn-primary" id="order-modal-submit" onclick="submitOrderModal()" aria-label="Place order">
        <span id="order-modal-submit-text">Place Order</span>
        <span id="order-modal-submit-spinner" class="spinner hidden" style="width:16px;height:16px;margin:0;"></span>
      </button>
    </div>
  </div>
</div>
